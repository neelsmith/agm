.mousike-notation { font-family: 'Mousike Notation', serif; }
/* base.css: page styles shared by agm.html and mss.html (inlined by build.js). */
:root { --bg:#fbfaf7; --fg:#222; --muted:#666; --line:#ddd; --accent:#7a3b12; --warn:#9a5b00; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1b1a18; --fg:#e8e6e1; --muted:#9a968e; --line:#3a3834; --accent:#e0a070; --warn:#e0b050; }
}
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 20px; border-bottom: 1px solid var(--line); }
h1 { margin: 0 0 14px; font-size: 1.4rem; }
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-bottom: 14px; }
.controls input[type=url] { flex: 1 1 380px; min-width: 0; padding: 6px 8px; font: inherit;
  background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 4px; }
button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--bg); cursor: pointer; }
#status { color: var(--muted); overflow-wrap: anywhere; }
#status.error { color: #c0392b; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
.note.muted { color: var(--muted); font-size: .85rem; }
.app-footer { max-width: 1100px; margin: 32px auto 0; padding: 10px 16px 18px; color: var(--muted);
  font-size: .72rem; opacity: .7; text-align: right; }

/* viewer.css: styles for lib/viewer.js (inlined by build.js). */
.viewer-frame { position: relative; overflow: hidden; height: min(70vh, 640px); border: 1px solid var(--line);
  border-radius: 6px; background: #111; cursor: grab; touch-action: none; user-select: none; }
.viewer-frame.dragging { cursor: grabbing; }
.viewer-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.viewer-img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; }
.viewer-frame.empty .viewer-img { visibility: hidden; }
.viewer-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #bbb; font-size: .9rem; padding: 16px; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
.viewer-msg:empty { display: none; }
.viewer-regions { position: absolute; inset: 0; pointer-events: none; }
.viewer-frame.empty .viewer-regions { display: none; }
.viewer-region { position: absolute; box-sizing: border-box; pointer-events: auto;
  border: 1.5px solid var(--roi, rgba(255,255,255,.75)); border-radius: 2px; }
.viewer-region.kind-notes { --roi: rgba(255, 190, 60, .85); --roi-fill: rgba(255, 190, 60, .30); }
.viewer-region.kind-syllables { --roi: rgba(80, 200, 255, .85); --roi-fill: rgba(80, 200, 255, .30); }
.viewer-region:hover, .viewer-region.active { border-width: 3px; border-color: #ff3b6b;
  background: rgba(255, 59, 107, .28); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.viewer-bar { display: flex; gap: 6px; margin-top: 6px; }
.viewer-btn { min-width: 40px; padding: 4px 10px; }
.credits { color: var(--muted); font-size: .8rem; margin: 6px 0 0; overflow-wrap: anywhere; }

  .text-picker { display:flex; flex-wrap: wrap; gap:10px; align-items:center; margin: 14px 0; }
  .text-picker label { font-weight: 600; }
  .text-picker select { font: inherit; padding: 6px 8px; max-width: 100%; min-width: 0;
    background: var(--bg); color: inherit; border: 1px solid var(--line); border-radius: 4px; }
  #text-out h2 { margin: 18px 0 2px; font-size: 1.15rem; }
  .urn-line { color: var(--muted); margin: 2px 0 8px; }
  .urn-line code { overflow-wrap: anywhere; }
  .catalog-record { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 10px 0;
    font-size: .9rem; }
  .catalog-record dt { color: var(--muted); }
  .catalog-record dd { margin: 0; overflow-wrap: anywhere; }
  .passage-picker { display:flex; flex-wrap: wrap; gap:10px; align-items:center; margin: 16px 0 8px; }
  .passage-picker label { font-weight: 600; }
  .passage-picker select { font: inherit; padding: 6px 8px; max-width: 100%; min-width: 0;
    background: var(--bg); color: inherit; border: 1px solid var(--line); border-radius: 4px; }
  .note { color: var(--warn); font-size: .9rem; }
  .passage-picker .or { color: var(--muted); }
  .passage-picker input[type=text] { font: inherit; padding: 6px 8px; width: 9em; min-width: 0;
    background: var(--bg); color: inherit; border: 1px solid var(--line); border-radius: 4px; }
  .passage-picker button { padding: 6px 12px; }
  #ref-error { flex-basis: 100%; }
  #ref-error:empty { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #passage-out h3 .count { font-family: system-ui, sans-serif; font-size: .85rem; font-weight: 400; color: var(--muted); }
  .selection { list-style: none; margin: 6px 0 0; padding: 0; }
  .sel-line { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 12px; align-items: baseline;
    padding: 4px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .sel-line .ref { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; color: var(--muted); }
  .sel-line .line-text { font-size: 1.25rem; }
  .sel-passage.syl { display: inline; padding: 1px 0; border-radius: 3px; }
  .sel-passage.syl.hl { background: rgba(255, 59, 107, .22); box-shadow: 0 0 0 2px rgba(255, 59, 107, .7); }
  li.sel-passage { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 12px; align-items: baseline;
    padding: 4px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: 4px; }

<script>
/*
 * cex.js — parse a `mousike` CEX release into plain JS data structures.
 *
 * Classic script (no ES modules) so the built app works from file://.
 * In the browser it defines a global `AgmCex`; in Node it is a CommonJS module.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.AgmCex = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const DEFAULT_URL =
    "https://raw.githubusercontent.com/neelsmith/mousike/refs/heads/main/releases/current.cex";

  const DELIMITER = "|";

  /** Expected column headers for each tabular block. */
  const BLOCK_SCHEMAS = {
    images: ["path", "description", "credits", "urn"],
    surfaces: ["urn", "label"],
    audio: ["file", "label", "notation"],
    catalog_annotated: ["urn", "citationScheme", "groupName", "workTitle", "versionLabel",
      "exemplarLabel", "online", "language"],
    catalog_embedded: ["urn", "citationScheme", "groupName", "workTitle", "versionLabel",
      "exemplarLabel", "online", "language"],
    mss: ["manuscript", "urn", "manifest", "urnmap"],
    texts: ["urn", "text"],
    // Parsed by parseTextsCols, not parseTable: `text` holds `columns` cells separated by "|".
    texts_cols: ["urn", "columns", "text"],
    notes: ["urn", "text"],
    syllables: ["urn", "text"],
    dse: ["image", "text", "surface"],
    mspages: ["urn", "label", "image"],
  };

  /** All blocks the app reads, in source order. */
  const BLOCK_NAMES = ["version"].concat(Object.keys(BLOCK_SCHEMAS));

  /** Blocks older releases may lack; their absence is handled, not reported as missing. */
  const OPTIONAL_BLOCKS = ["catalog_annotated", "catalog_embedded", "mss", "mspages", "texts_cols"];

  /**
   * Split raw CEX text into named blocks of non-empty lines.
   * Lines beginning with `//` are CEX comments and are skipped.
   * Lines before the first `#!` header are ignored.
   * @returns {Object<string, string[][]>} block name -> list of line arrays
   *   (a list of lists, because a block label may in principle repeat).
   */
  function splitBlocks(src) {
    const blocks = {};
    let current = null;
    const lines = String(src).replace(/^﻿/, "").split(/\r?\n/);
    for (const raw of lines) {
      const line = raw.trim();
      if (line.startsWith("#!")) {
        const name = line.slice(2).trim().toLowerCase();
        current = [];
        (blocks[name] = blocks[name] || []).push(current);
        continue;
      }
      if (current === null || line === "" || line.startsWith("//")) continue;
      current.push(raw.replace(/\s+$/, ""));
    }
    return blocks;
  }

  /**
   * Parse a delimited block whose first line is a header row.
   * Repeated blocks with the same name are concatenated.
   * Returns { rows, warnings } where rows are objects keyed by column name.
   */
  function parseTable(name, blockLists, warnings) {
    const expected = BLOCK_SCHEMAS[name];
    const rows = [];
    for (const lines of blockLists) {
      if (lines.length === 0) continue;
      const header = lines[0].split(DELIMITER).map((h) => h.trim());
      if (header.join("|") !== expected.join("|")) {
        warnings.push(
          `#!${name}: header "${header.join("|")}" differs from expected "${expected.join("|")}"`
        );
      }
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(DELIMITER);
        if (cols.length !== header.length) {
          warnings.push(
            `#!${name}: row ${i} has ${cols.length} columns, expected ${header.length}: ${lines[i]}`
          );
          continue;
        }
        const row = {};
        header.forEach((h, j) => (row[h] = cols[j].trim()));
        rows.push(row);
      }
    }
    return rows;
  }

  /**
   * Parse `#!texts_cols`: texts laid out in columns (e.g. a sign's name, its vocal and its
   * instrumental notation). Each line is `urn|columns|cell1|cell2|…`: the text after the
   * second delimiter is split into cells on "|" and should have `columns` cells. Repeated header
   * lines are skipped. Rows: { urn, columns (number), cells: [string], text (cells joined " | ") }.
   */
  function parseTextsCols(blockLists, warnings) {
    const expected = BLOCK_SCHEMAS.texts_cols.join("|");
    const rows = [];
    for (const lines of blockLists) {
      lines.forEach((line, i) => {
        const parts = line.split(DELIMITER);
        if (parts.map((p) => p.trim()).join("|") === expected) {
          if (i > 0) warnings.push(`#!texts_cols: repeated header line ${i} skipped`);
          return;
        }
        if (i === 0) warnings.push(`#!texts_cols: header "${line}" differs from expected "${expected}"`);
        const urn = parts[0].trim();
        const columns = Number(parts[1]);
        if (parts.length < 3 || !Number.isInteger(columns) || columns < 1) {
          warnings.push(`#!texts_cols: row ${i} needs urn|columns|text: ${line}`);
          return;
        }
        const cells = parts.slice(2).map((c) => c.trim());
        if (cells.length !== columns) {
          warnings.push(`#!texts_cols: ${urn} has ${cells.length} cell(s), expected ${columns}`);
        }
        rows.push({ urn, columns, cells, text: cells.join(" | ") });
      });
    }
    return rows;
  }

  /* ---------- URN helpers ---------- */

  /** Split a URN with an optional `@extension` (e.g. a CITE2 image ROI). */
  function splitExtension(urn) {
    const at = urn.indexOf("@");
    return at < 0
      ? { base: urn, extension: null }
      : { base: urn.slice(0, at), extension: urn.slice(at + 1) };
  }

  /**
   * Parse an image region of interest (four comma-separated fractions of image size)
   * or return null. Order is left,top,width,height: in the 2026a DSE data the first
   * value increases across a line of the stele and the second increases line by line.
   */
  function parseRoi(extension) {
    if (!extension) return null;
    const nums = extension.split(",").map(Number);
    if (nums.length !== 4 || nums.some((n) => !Number.isFinite(n))) return null;
    const [left, top, width, height] = nums;
    return { left, top, width, height };
  }

  /**
   * Parse a CITE2 URN: colon-separated parts
   *   urn:cite2:NAMESPACE:COLLECTION[.VERSION]:OBJECT[@EXTENSION]
   * The final part is the object identifier; it may carry `@` + a region of interest.
   * A URN with only four parts identifies a collection, not an object (object = null).
   * Returns null if the string is not a cite2 URN.
   */
  function parseCite2(urn) {
    const { base, extension } = splitExtension(String(urn).trim());
    const parts = base.split(":");
    if (parts.length < 4 || parts.length > 5 || parts[0] !== "urn" || parts[1] !== "cite2") {
      return null;
    }
    const [collection, ...ver] = parts[3].split(".");
    return {
      urn: base, // object (or collection) URN without the extension
      namespace: parts[2],
      collection,
      version: ver.length ? ver.join(".") : null,
      object: parts.length === 5 ? parts[4] : null,
      extension,
      roi: parseRoi(extension),
    };
  }

  /**
   * Find the catalog image for a (possibly ROI-extended) image URN.
   * Matches on namespace, collection and object; when the reference omits a version,
   * any version in the catalog matches. Returns the image row or null.
   */
  function resolveImage(images, ref) {
    const r = typeof ref === "string" ? parseCite2(ref) : ref;
    if (!r || !r.object) return null;
    for (const img of images) {
      const c = img.cite2;
      if (!c) continue;
      if (c.namespace === r.namespace && c.collection === r.collection && c.object === r.object &&
          (r.version === null || r.version === c.version)) {
        return img;
      }
    }
    return null;
  }

  /**
   * Split a CTS URN into work component and passage reference.
   * urn:cts:mousike:epigraphic.seikilos.text:1.2
   *   -> { work: "urn:cts:mousike:epigraphic.seikilos.text", passage: "1.2" }
   */
  function ctsParts(urn) {
    const parts = urn.split(":");
    if (parts.length < 4 || parts[0] !== "urn" || parts[1] !== "cts") {
      return { work: urn, passage: null };
    }
    if (parts.length === 4) return { work: urn, passage: null };
    return { work: parts.slice(0, 4).join(":"), passage: parts.slice(4).join(":") };
  }

  /**
   * Tokenize a line of notation: whitespace separates note groups;
   * `~` joins notes sung to a single syllable (melisma).
   */
  function tokenizeNotes(text) {
    return text
      .split(/\s+/)
      .filter(Boolean)
      .map((group) => group.split("~").filter(Boolean));
  }

  /**
   * Derive the 2-tier citation of a notes edition: a line `…notes:L` with groups
   * g1 g2 … yields one record per note group, cited `…notes:L.N` (N counts from 1),
   * analogous to syllables `…syllables:L.N`.
   * Each record: { urn, work, passage, line (URN of the line), group (N),
   *   notes: [note, …], text: notes joined with "~" }
   */
  function noteGroups(noteLines) {
    const out = [];
    for (const line of noteLines) {
      line.tokens.forEach((notes, i) => {
        const passage = `${line.passage}.${i + 1}`;
        out.push({
          urn: `${line.work}:${passage}`,
          work: line.work,
          passage,
          line: line.urn,
          group: i + 1,
          notes,
          text: notes.join("~"),
        });
      });
    }
    return out;
  }

  /** Build a Map from key column to row; warn on duplicate keys. */
  function indexBy(rows, key, name, warnings) {
    const m = new Map();
    for (const r of rows) {
      if (m.has(r[key])) warnings.push(`#!${name}: duplicate ${key} ${r[key]}`);
      m.set(r[key], r);
    }
    return m;
  }

  /* ---------- main entry point ---------- */

  /**
   * Parse a complete mousike CEX release.
   * @param {string} src raw CEX text
   * @returns {object} { version, images, surfaces, audio, catalog_annotated, texts, notes,
   *   syllables, dse, mspages, dseAll, index: {...Maps}, warnings: string[], cataloged: boolean }
   *
   * `dse` holds the DSE records for cataloged texts; `dseAll` holds every DSE record.
   *
   * Only texts cataloged in `#!catalog_annotated` are handled: rows of `#!texts`, `#!notes`,
   * `#!syllables`, DSE records citing a passage, and audio tracks whose notation URN is in a
   * work that isn't cataloged are dropped (one warning per work and block). A release with no
   * `#!catalog_annotated` block (before 2026h) keeps everything, with one warning;
   * `cataloged` is then false.
   */
  function parseCex(src) {
    const warnings = [];
    const blocks = splitBlocks(src);

    for (const name of BLOCK_NAMES) {
      if (!blocks[name] && !OPTIONAL_BLOCKS.includes(name)) warnings.push(`missing block #!${name}`);
    }
    for (const name of Object.keys(blocks)) {
      if (!BLOCK_NAMES.includes(name)) warnings.push(`unrecognized block #!${name} ignored`);
    }

    // 1. version: a single bare value
    const versionLines = (blocks.version || []).flat();
    const version = versionLines.length ? versionLines[0].trim() : null;
    if (versionLines.length > 1) warnings.push("#!version: more than one line; using the first");

    const table = (name) => parseTable(name, blocks[name] || [], warnings);

    const images = table("images").map((r) => {
      const cite2 = parseCite2(r.urn);
      if (!cite2 || !cite2.object) warnings.push(`#!images: not a CITE2 object URN: ${r.urn}`);
      return Object.assign(r, { cite2 });
    });
    const surfaces = table("surfaces");

    // Catalog of texts with musical annotation; URNs are work-level, e.g. "…seikilos.notes:".
    const cataloged = Boolean(blocks.catalog_annotated);
    const catalog_annotated = table("catalog_annotated").map((r) => {
      const { work } = ctsParts(r.urn);
      if (!/^urn:cts:/.test(r.urn)) warnings.push(`#!catalog_annotated: not a CTS URN: ${r.urn}`);
      return Object.assign(r, { work: work.replace(/:$/, ""), isOnline: r.online === "true" });
    });
    const catalogWorks = new Set(catalog_annotated.map((r) => r.work));
    if (!cataloged) {
      warnings.push("no #!catalog_annotated block: treating every text in the release as cataloged");
    }
    /** Keep rows whose CTS work (from `urnOf(row)`) is cataloged; warn once per dropped work. */
    const onlyCataloged = (name, rows, urnOf) => {
      if (!cataloged) return rows;
      const dropped = new Map();
      const kept = rows.filter((r) => {
        const { work } = ctsParts(String(urnOf(r) || ""));
        if (catalogWorks.has(work)) return true;
        dropped.set(work, (dropped.get(work) || 0) + 1);
        return false;
      });
      for (const [work, n] of dropped) {
        warnings.push(`#!${name}: ${n} row(s) for uncataloged ${work} ignored`);
      }
      return kept;
    };

    // Catalog of texts with embedded notation (2026h): theoretical texts quoting musical signs.
    // Only these works' `#!texts_cols` rows are kept. A release without the block keeps them all.
    const catalogedEmbedded = Boolean(blocks.catalog_embedded);
    const catalog_embedded = table("catalog_embedded").map((r) => {
      const { work } = ctsParts(r.urn);
      if (!/^urn:cts:/.test(r.urn)) warnings.push(`#!catalog_embedded: not a CTS URN: ${r.urn}`);
      return Object.assign(r, { work: work.replace(/:$/, ""), isOnline: r.online === "true" });
    });
    const embeddedWorks = new Set(catalog_embedded.map((r) => r.work));
    const texts_cols = parseTextsCols(blocks.texts_cols || [], warnings)
      .map((r) => Object.assign(r, ctsParts(r.urn)))
      .filter((r) => {
        if (!catalogedEmbedded || embeddedWorks.has(r.work)) return true;
        warnings.push(`#!texts_cols: uncataloged ${r.urn} ignored`);
        return false;
      });

    const audio = onlyCataloged("audio", table("audio"), (r) => r.notation);
    const texts = onlyCataloged("texts", table("texts"), (r) => r.urn)
      .map((r) => Object.assign(r, ctsParts(r.urn)));
    const notes = onlyCataloged("notes", table("notes"), (r) => r.urn).map((r) =>
      Object.assign(r, ctsParts(r.urn), { tokens: tokenizeNotes(r.text) })
    );
    const syllables = onlyCataloged("syllables", table("syllables"), (r) => r.urn)
      .map((r) => Object.assign(r, ctsParts(r.urn)));
    // All DSE records (kept as `dseAll`, e.g. for images in agm-mss.html), and those for cataloged texts.
    const dseAll = table("dse").map((r) => {
      const cite2 = parseCite2(r.image);
      if (!cite2 || !cite2.object) {
        warnings.push(`#!dse: image is not a CITE2 object URN: ${r.image}`);
      } else if (cite2.extension && !cite2.roi) {
        warnings.push(`#!dse: unparseable region of interest: ${r.image}`);
      }
      return Object.assign(r, {
        imageObject: cite2 ? cite2.urn : null,
        roi: cite2 ? cite2.roi : null,
        cite2,
      });
    });
    const dse = onlyCataloged("dse", dseAll, (r) => r.text);

    // Manuscripts (2026h): a collection-level CITE2 URN, an IIIF manifest and a urnmap per manuscript,
    // and one row per page with its CITE2 URN, label and image URN.
    const mss = table("mss");
    const mspages = table("mspages");

    const index = {
      images: indexBy(images, "urn", "images", warnings),
      surfaces: indexBy(surfaces, "urn", "surfaces", warnings),
      texts: indexBy(texts, "urn", "texts", warnings),
      notes: indexBy(notes, "urn", "notes", warnings),
      syllables: indexBy(syllables, "urn", "syllables", warnings),
      // Cataloged works, keyed by work URN without passage ("urn:cts:ns:group.work.version")
      catalog: indexBy(catalog_annotated, "work", "catalog_annotated", warnings),
      catalogEmbedded: indexBy(catalog_embedded, "work", "catalog_embedded", warnings),
      textsCols: indexBy(texts_cols, "urn", "texts_cols", warnings),
      mss: indexBy(mss, "urn", "mss", warnings),
      mspages: indexBy(mspages, "urn", "mspages", warnings),
      // Derived from #!notes: one entry per note group, cited line.group
      noteGroups: indexBy(noteGroups(notes.filter((n) => n.passage)), "urn", "notes (groups)", warnings),
    };

    return {
      version, images, surfaces, audio, catalog_annotated, catalog_embedded, mss, texts, texts_cols,
      notes, syllables, dse, mspages, dseAll, index, warnings, cataloged, catalogedEmbedded,
    };
  }

  /** Fetch and parse a CEX release (browser or Node 18+). */
  async function loadCex(url, fetchImpl) {
    const f = fetchImpl || (typeof fetch !== "undefined" ? fetch : null);
    if (!f) throw new Error("No fetch implementation available");
    const res = await f(url || DEFAULT_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status} loading ${url || DEFAULT_URL}`);
    return parseCex(await res.text());
  }

  return {
    DEFAULT_URL,
    BLOCK_NAMES,
    BLOCK_SCHEMAS,
    OPTIONAL_BLOCKS,
    splitBlocks,
    parseTextsCols,
    splitExtension,
    parseRoi,
    parseCite2,
    resolveImage,
    ctsParts,
    tokenizeNotes,
    noteGroups,
    parseCex,
    loadCex,
  };
});

</script>

/*
 * notation.js — Greek musical notation in Zach Sowerby's URN scheme, rendered as Unicode.
 *
 * A JavaScript port of mousike's `note.py` / `unicode.py`; output should be identical.
 *
 * A note is cited by a URN in `urn:cite2:zst:` (the short form drops the prefix) with up to
 * five dot-separated tiers, e.g. `gvn:11.1.1.0.0`:
 *   1. base note
 *   2. sharpening (1 = unsharpened, 2 = first sharp, 3 = second sharp)
 *   3. length: 1 = no length sign, 2–5 = diseme, triseme, tetraseme, pentaseme
 *   4. arsis: 1 if the note carries an arsis dot (stigme), else 0
 *   5. hyphen: 1 if the note carries a hyphen, else 0 (not rendered)
 * Collections: `gvn` (vocal), `gin` (instrumental), `gcn` (other signs, e.g. the rest `gcn:1`,
 * which has a single tier).
 *
 * Rendering: the first two tiers choose the sign from Sowerby's table; length and arsis are
 * added as combining marks after the sign's first character (so on the letter, not the
 * prime, in upper-octave signs like `Ο′`). Groups are separated by one space; notes joined
 * with `~` (several notes over one syllable) are written with no space.

 * first), CommonJS in Node.

    3: "\u{1D242}",     // COMBINING GREEK MUSICAL TRISEME
    4: "\u{1D243}",     // COMBINING GREEK MUSICAL TETRASEME

  const COLLECTIONS = [...new Set(Object.keys(TABLE).map((k) => k.split(":")[0]))];
  const ONE_NOTE = `(?:${URN_PREFIX.replace(/[.]/g, "\\.")})?(?:${COLLECTIONS.join("|")}):\\d+(?:\\.\\d+){0,4}`;
  const EMBEDDED_RE = new RegExp(`(?<![\\w:.])${ONE_NOTE}(?:${JOINER}${ONE_NOTE})*(?![\\w:])`, "g");

   * Split running text into plain text and note URNs (e.g. "ζῆτα … gvn:7.1.1.0.0"), converting
   * each note (or `~`-joined group of notes) to Unicode.
   * Returns [{ text } | { urn, unicode, ok }], in order; `ok` is false when a note isn't in the
   * table (its `unicode` is then "[urn]").
   */
  function splitEmbeddedNotation(text) {
    const out = [];
    const src = String(text ?? "");
    let last = 0;
    for (const m of src.matchAll(EMBEDDED_RE)) {
      if (m.index > last) out.push({ text: src.slice(last, m.index) });
      let unicode, ok = true;
      try { unicode = notesToUnicode(m[0]); } catch (e) { unicode = `[${m[0]}]`; ok = false; }
      out.push({ urn: m[0], unicode, ok });
      last = m.index + m[0].length;
    }
    if (last < src.length) out.push({ text: src.slice(last) });
    return out;
  }

  return {
    URN_PREFIX,
    LENGTH_MARKS,
    ARSIS_MARK,
    TABLE,
    parseNote,
    noteToUnicode,
    parseNoteGroups,
    groupsToUnicode,
    notesToUnicode,
    notesToUnicodeSafe,
    splitEmbeddedNotation,

      e.preventDefault();

    img.addEventListener("load", () => {

      msg.textContent = "";
      frame.classList.remove("empty");
      fit();

    img.addEventListener("error", () => {

      onRegionHover: (fn) => { hoverFn = fn; },

/*
 * mss.js — manuscripts: the `#!mss` / `#!mspages` blocks of a mousike release, IIIF manifests,

  "use strict";

  const THUMB_WIDTH = 256;      // px width of light-table thumbnails

  /** Manuscripts for a menu: [{ urn, label, manifest, urnmap }] in `#!mss` order. */
  function manuscriptMenu(data) {

   * Parse a urnmap file: `//` comment lines, then a header line, then `|`-delimited rows.
   * Returns { rows: [{ image, urn, label, … }], warnings }.

      .filter((l) => l.trim() && !l.trim().startsWith("//"));

      if (!header.includes(col)) warnings.push(`urnmap: header has no "${col}" column`);
    }

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split("|");

  function dseImageCounts(dseRows) {

  function ctsWork(urn) {

    return { entries, counts: { images: entries.length, found, missing: entries.length - found, withDse }, warnings };
  }

  return {
    THUMB_WIDTH, VIEW_SIZE,
    manuscriptMenu, serviceKey, parseUrnMap, labelText, manifestImages, iiifImageUrl,
    lightTable, pagesFor, loadManuscript, imageBase, dseImageCounts, embeddedDse, imagePassages,
  };
});

<script>
/*
 * texts.js — queries for agm-texts.html over a parsed mousike release (output of AgmCex.parseCex).
 *
 * The app works from both catalogs of texts:
 *   #!catalog_annotated  texts with musical annotation (e.g. Seikilos: notes, syllables, text)
 *   #!catalog_embedded   theoretical texts with notation embedded in them (e.g. Alypius)
 *
 * Classic UMD script: global `AgmTexts` in the browser (needs `AgmMss` and `AgmEdition` loaded
 * first), CommonJS in Node. Pure functions, apart from `resolveImage`, which fetches urnmaps.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory(require("./mss.js"), require("./edition.js"));
  } else {
    root.AgmTexts = factory(root.AgmMss, root.AgmEdition);
  }
})(typeof self !== "undefined" ? self : this, function (Mss, Edition) {
  "use strict";

  /** The two catalogs, in menu order, with a heading for each. */
  const CATALOGS = [
    { kind: "embedded", block: "catalog_embedded", heading: "Texts with embedded notation" },
    { kind: "annotated", block: "catalog_annotated", heading: "Texts with musical annotation" },
  ];

  /**
   * True for an edition of musical notation by itself: by convention, the version part of the
   * CTS work component is `notes` (e.g. "urn:cts:mousike:epigraphic.seikilos.notes").
   */
  function isNotation(work) {
    const parts = String(work || "").replace(/:$/, "").split(":");
    const id = parts.length >= 4 ? parts[3] : "";
    return id.split(".").pop() === "notes";
  }

  /** The version part of a CTS work component ("…seikilos.syllables" -> "syllables"). */
  function versionOf(work) {
    const parts = String(work || "").replace(/:$/, "").split(":");
    return parts.length >= 4 ? parts[3].split(".").pop() : "";
  }

  /** True for an edition cited by syllable: the version part of the work component is `syllables`. */
  function isSyllables(work) {
    return versionOf(work) === "syllables";
  }

  /** The reference of the unit containing passage `ref` ("1.4" -> "1"; "1" -> ""). */
  function containerOf(ref) {
    const parts = String(ref).split(".");
    return parts.length > 1 ? parts.slice(0, -1).join(".") : "";
  }

  /**
   * Group consecutive passages by their containing unit, keeping text order:
   * [{ container, passages }] (e.g. syllables 1.1–1.5 under "1", then 2.1 under "2").
   */
  function groupByContainer(passages) {
    const out = [];
    for (const p of passages) {
      const c = containerOf(p.passage);
      const last = out[out.length - 1];
      if (last && last.container === c) last.passages.push(p);
      else out.push({ container: c, passages: [p] });
    }
    return out;
  }

  /** Menu label for a catalog row: "Group, Title (version)", leaving out empty parts. */
  function catalogLabel(c) {
    const head = [c.groupName, c.workTitle].filter(Boolean).join(", ") || c.work || c.urn;
    return c.versionLabel ? `${head} (${c.versionLabel})` : head;
  }

  /**
   * One menu of texts from both catalogs: [{ urn, work, kind, heading, label, catalog }],
   * embedded texts first, then annotated, each in catalog order. `urn` is the catalog's
   * work-level URN (with its trailing colon); `work` is the same without it.
   * A work listed in both catalogs appears once, under the first. Editions of musical notation
   * by itself (see isNotation) are left out.
   */
  function textMenu(data) {
    const out = [];
    const seen = new Set();
    for (const cat of CATALOGS) {
      for (const c of data[cat.block] || []) {
        if (seen.has(c.work) || isNotation(c.work)) continue;
        seen.add(c.work);
        out.push({ urn: c.urn, work: c.work, kind: cat.kind, heading: cat.heading, label: catalogLabel(c), catalog: c });
      }
    }
    return out;
  }

  /**
   * The passages of one cataloged work, in source order, from whichever blocks cite it:
   * `#!texts_cols` for embedded texts; `#!texts`, `#!notes` and `#!syllables` for annotated ones.
   * Returns [{ urn, passage, block, row }].
   */
  function passagesFor(data, work) {
    const out = [];
    for (const block of ["texts_cols", "texts", "notes", "syllables"]) {
      for (const row of data[block] || []) {
        if (row.work === work) out.push({ urn: row.urn, passage: row.passage, block, row });
      }
    }
    return out;
  }

  /** "urn:cts:ns:work:passage" -> "urn:cts:ns:work" (null if not a CTS URN). */
  function ctsWork(urn) {
    const parts = String(urn || "").split(":");
    return parts.length >= 5 && parts[0] === "urn" && parts[1] === "cts" ? parts.slice(0, 4).join(":") : null;
  }

  /**
   * The passages of `work` for a menu, built from its text edition (see passagesFor), in text order,
   * each with the DSE records (from `data.dseAll`, every DSE record) that cite it, possibly none.
   * Returns [{ urn, passage, block, row, records: [dse rows] }].
   */
  function textPassages(data, work) {
    const byUrn = new Map();
    for (const r of data.dseAll || data.dse || []) {
      if (ctsWork(r.text) !== work) continue;
      if (!byUrn.has(r.text)) byUrn.set(r.text, []);
      byUrn.get(r.text).push(r);
    }
    return passagesFor(data, work).map((p) => ({ ...p, records: byUrn.get(p.urn) || [] }));
  }

  /* ---------- selecting passages by reference ---------- */

  /** Does passage reference `passage` fall under reference `ref` ("1" covers 1, 1.1, 1.1.2, …)? */
  function refMatches(passage, ref) {
    return passage === ref || String(passage).startsWith(ref + ".");
  }

  /**
   * Select passages by a citation reference, in text order: a single reference ("1.1"), a level of
   * the hierarchy ("1" = every passage under 1), or a range of either ("1.1-1.4", "1-2.1"): from the
   * first passage under the start through the last passage under the end.
   * `passages` are in text order (each with a `passage` reference); `work` (optional) lets a
   * reference be given as a full URN ("<work>:1.1"). Returns { passages, error }.
   */
  function selectByReference(passages, input, work) {
    let text = String(input || "").trim();
    if (work && text.startsWith(work + ":")) text = text.slice(work.length + 1);
    if (!text) return { passages: [], error: "Enter a reference, e.g. 1.1, 1, or 1.1-1.4" };
    const bounds = text.split("-").map((x) => x.trim());
    if (bounds.length > 2 || bounds.some((b) => !b)) {
      return { passages: [], error: `"${text}" is not a reference or a range of two references` };
    }
    const [from, to = from] = bounds;
    const start = passages.findIndex((p) => refMatches(p.passage, from));
    if (start < 0) return { passages: [], error: `No passage ${from} in this text` };
    let end = -1;
    for (let i = passages.length - 1; i >= 0; i--) if (refMatches(passages[i].passage, to)) { end = i; break; }
    if (end < 0) return { passages: [], error: `No passage ${to} in this text` };
    if (end < start) return { passages: [], error: `${to} comes before ${from} in this text` };
    return { passages: passages.slice(start, end + 1), error: null };
  }

  /* ---------- images for DSE records ---------- */

  /** The `#!mss` row whose collection URN begins `urn` (a page or surface URN), or null. */
  function manuscriptOf(data, urn) {
    const u = String(urn || "");
    return (data.mss || []).find((m) => {
      const prefix = String(m.urn || "").replace(/:?$/, ":");
      return prefix.length > 1 && u.startsWith(prefix);
    }) || null;
  }

  /**
   * Where the image cited by DSE record `dse` comes from, without fetching anything:
   *   { kind: "catalog", imageUrn, url, label, credits }  an `#!images` row with a `path`
   *   { kind: "iiif", imageUrn, ms, page, label }          a manuscript page: its `#!mss` row
   *        (found from the `#!mspages` row for the image, else from the DSE surface) gives the
   *        urnmap that maps the image URN to an IIIF Image service
   *   { kind: "unknown", imageUrn, label }                  neither
   */
  function imageSource(data, dse) {
    const imageUrn = Mss.imageBase(dse.image);
    const img = (data.images || []).find((r) => r.urn === imageUrn && r.path);
    if (img) {
      return { kind: "catalog", imageUrn, url: Edition.imageUrl(img), label: img.description || imageUrn, credits: img.credits || "" };
    }
    const page = (data.mspages || []).find((p) => p.image === imageUrn) || null;
    const ms = manuscriptOf(data, page ? page.urn : dse.surface);
    if (ms) return { kind: "iiif", imageUrn, ms, page, label: page ? page.label : ms.manuscript };
    return { kind: "unknown", imageUrn, label: imageUrn };
  }

  /**
   * Resolve DSE record `dse` to an image URL: { url, label, credits, source } or { error, source }.
   * IIIF images need the manuscript's urnmap; fetched urnmaps are kept in `cache` (a Map by URL).
   */
  async function resolveImage(data, dse, fetchImpl, cache) {
    const source = imageSource(data, dse);
    if (source.kind === "catalog") return { url: source.url, label: source.label, credits: source.credits, source };
    if (source.kind === "unknown") return { error: `no image source for ${source.imageUrn}`, source };
    const { ms } = source;
    if (!ms.urnmap) return { error: `#!mss has no urnmap for ${ms.manuscript}`, source };
    const f = fetchImpl || (typeof fetch !== "undefined" ? fetch : null);
    try {
      let rows = cache && cache.get(ms.urnmap);
      if (!rows) {
        const res = await f(ms.urnmap);
        if (!res.ok) throw new Error(`HTTP ${res.status} loading ${ms.urnmap}`);
        rows = Mss.parseUrnMap(await res.text()).rows;
        if (cache) cache.set(ms.urnmap, rows);
      }
      const row = rows.find((r) => r.urn === source.imageUrn);
      if (!row) return { error: `${source.imageUrn} is not in the urnmap for ${ms.manuscript}`, source };
      return { url: Mss.iiifImageUrl(row.image, Mss.VIEW_SIZE), label: source.label, credits: "", source };
    } catch (e) {
      return { error: e.message, source };
    }
  }

  /**
   * The images that selected passages (each with `records`, as from textPassages) are indexed to,
   * in order of first appearance: [{ imageUrn, records: [dse rows on that image] }].
   */
  function imagesForPassages(passages) {
    const out = new Map();
    for (const p of passages) {
      for (const r of p.records || []) {
        const k = Mss.imageBase(r.image);
        if (!out.has(k)) out.set(k, { imageUrn: k, records: [] });
        out.get(k).records.push(r);
      }
    }
    return [...out.values()];
  }

  /** Smallest region containing all the given regions of interest (null if none). */
  function unionRoi(rois) {
    const rs = (rois || []).filter(Boolean);
    if (!rs.length) return null;
    const left = Math.min(...rs.map((r) => r.left)), top = Math.min(...rs.map((r) => r.top));
    const right = Math.max(...rs.map((r) => r.left + r.width)), bottom = Math.max(...rs.map((r) => r.top + r.height));
    return { left, top, width: right - left, height: bottom - top };
  }

  /**
   * Regions to draw on an image (URN without `@`): every DSE record on it with a region of
   * interest, as viewer regions { id: passage URN, roi, kind, title }. `kind` is "passage" for
   * passages of `work` and "other" for the rest.
   */
  function imageRegions(data, imageUrn, work) {
    return (data.dseAll || data.dse || [])
      .filter((r) => r.roi && Mss.imageBase(r.image) === imageUrn)
      .map((r) => {
        const w = ctsWork(r.text);
        return { id: r.text, roi: r.roi, kind: w === work ? "passage" : "other", title: w === work ? r.text.slice(w.length + 1) : r.text };
      });
  }

  return {
    CATALOGS, isNotation, catalogLabel, textMenu, passagesFor, ctsWork, textPassages,
    manuscriptOf, imageSource, resolveImage, imageRegions,
    refMatches, selectByReference, imagesForPassages, unionRoi,
    versionOf, isSyllables, containerOf, groupByContainer,
  };
});

<script>
/* texts-app.js — UI for agm-texts.html. Depends on globals AgmCex, AgmNotation, AgmViewer and AgmTexts. */
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // Data-source controls exist only in the fixture build (see build.js), so these may be null.
  const urlInput = $("url");
  const loadButton = $("load");
  const fileInput = $("file");
  const statusEl = $("status");
  const textSelect = $("text");
  const textOut = $("text-out");

  /** App state, exposed for console inspection. */
  window.texts = { data: null, menu: [], text: null, passages: [], passage: null, selection: [], images: [],
    viewer: null, selectText, selectPassage, selectReference, showImage };

  const urnmapCache = new Map(); // urnmap URL -> parsed rows, shared across passages

  if (urlInput) urlInput.value = AgmCex.DEFAULT_URL;

  function setStatus(msg, isError, title) {
    statusEl.textContent = msg;
    statusEl.title = title || "";
    statusEl.className = isError ? "error" : "";
  }

  /** Drop null/empty items, for replaceChildren (which would turn `null` into text). */
  const present = (...nodes) => nodes.filter((n) => n !== null && n !== undefined && n !== "");

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, attrs || {});
    for (const k of kids) if (k !== null && k !== undefined && k !== "") e.append(k);
    return e;
  }

  /* ---------- the menu of texts, from #!catalog_embedded and #!catalog_annotated ---------- */

  function renderMenu(d) {
    const menu = AgmTexts.textMenu(d);
    window.texts.menu = menu;
    const groups = [];
    for (const cat of AgmTexts.CATALOGS) {
      const items = menu.filter((t) => t.kind === cat.kind);
      if (!items.length) continue;
      groups.push(el("optgroup", { label: cat.heading },
        ...items.map((t) => el("option", { value: t.work, textContent: t.label, title: t.urn }))));
    }
    textSelect.replaceChildren(
      el("option", { value: "", textContent: menu.length ? "Choose a text…" : "No cataloged texts in this release" }),
      ...groups);
    textSelect.disabled = menu.length === 0;
    textOut.replaceChildren();
  }

  /** Select a text by work URN (without trailing colon) and show its catalog record. */
  function selectText(work) {
    textSelect.value = work || "";
    const t = window.texts.menu.find((x) => x.work === work) || null;
    window.texts.text = t;
    if (!t) { textOut.replaceChildren(); return null; }

    const c = t.catalog;
    const n = AgmTexts.passagesFor(window.texts.data, t.work).length;
    const passages = AgmTexts.textPassages(window.texts.data, t.work);
    const indexed = passages.filter((p) => p.records.length).length;
    window.texts.passages = passages;
    window.texts.passage = null;
    const fields = [
      ["Group", c.groupName], ["Work", c.workTitle], ["Version", c.versionLabel],
      ["Exemplar", c.exemplarLabel], ["Citation", c.citationScheme], ["Language", c.language],
      ["Online", c.online], ["Passages", String(n)], ["With images (DSE)", String(indexed)],
    ].filter(([, v]) => v !== undefined && v !== null && v !== "");
    textOut.replaceChildren(
      el("h2", { textContent: t.label }),
      el("p", { className: "urn-line" }, el("code", { textContent: t.urn }), " ",
        el("span", { className: "kind", textContent: t.heading })),
      el("dl", { className: "catalog-record" },
        ...fields.flatMap(([k, v]) => [el("dt", { textContent: k }), el("dd", { textContent: v })])),
      passagePicker(passages),
      el("section", { id: "passage-out" }));
    return t;
  }

  /* ---------- choosing passages: menu or reference ---------- */

  /**
   * Two ways to choose passages: a menu of all the text's passages (those indexed to an image are
   * marked ◆), or a reference typed in the box: "1.1", a level such as "1", or a range "1.1-1.4",
   * "1-2.1".
   */
  function passagePicker(passages) {
    if (!passages.length) {
      return el("p", { className: "note muted", textContent: "This release has no passages of this text." });
    }
    const indexed = passages.filter((p) => p.records.length).length;
    const select = el("select", { id: "passage" },
      el("option", { value: "", textContent: `Choose a passage… (${passages.length}; ◆ ${indexed} with images)` }),
      ...passages.map((p) => el("option", { value: p.urn, textContent: optionLabel(p), title: p.urn })));
    select.addEventListener("change", () => {
      const ref = $("ref");
      if (ref) ref.value = "";
      setRefError("");
      selectPassage(select.value);
    });

    const example = refExample(passages);
    const ref = el("input", { type: "text", id: "ref", placeholder: example, spellcheck: false, autocomplete: "off",
      title: `A passage (${passages[0].passage}), a level, or a range such as ${example}` });
    const go = el("button", { type: "button", textContent: "Show" });
    const run = () => selectReference(ref.value);
    go.addEventListener("click", run);
    ref.addEventListener("keydown", (e) => { if (e.key === "Enter") { run(); e.preventDefault(); } });
    return el("section", { className: "passage-picker" },
      el("label", { htmlFor: "passage", textContent: "Passage" }), select,
      el("span", { className: "or", textContent: "or" }),
      el("label", { htmlFor: "ref", className: "sr-only", textContent: "Reference" }), ref, go,
      el("span", { id: "ref-error", className: "note", role: "status" }));
  }

  /** A sample range for the box's placeholder, from the text's own first passages. */
  function refExample(passages) {
    const first = passages[0].passage;
    const later = passages[Math.min(3, passages.length - 1)].passage;
    return first === later ? first : `${first}-${later}`;
  }

  function setRefError(msg) {
    const e = $("ref-error");
    if (e) e.textContent = msg;
  }

  /** "◆ 1.2 — Προσλαμβανόμενος. ζῆτα ἐλλϊπὲς…" (notation shown as ♪; options can't use the notation font). */
  function optionLabel(p) {
    const mark = p.records.length ? "◆ " : "";
    const text = (p.row.cells || [p.row.text]).join(" ");
    const plain = AgmNotation.splitEmbeddedNotation(text).map((s) => (s.urn ? "♪" : s.text)).join("")
      .replace(/\s+/g, " ").trim();
    const preview = plain.length > 48 ? plain.slice(0, 47).trimEnd() + "…" : plain;
    return mark + (preview ? `${p.passage} — ${preview}` : p.passage);
  }

  /** Select one passage (by URN) of the current text, as from the menu. */
  function selectPassage(urn) {
    const select = $("passage");
    if (select) select.value = urn || "";
    const p = window.texts.passages.find((x) => x.urn === urn) || null;
    return showSelection(p ? [p] : [], p ? p.passage : "");
  }

  /** Select passages by a reference typed in the box ("1.1", "1", "1.1-1.4", "1-2.1"). */
  function selectReference(input) {
    const t = window.texts.text;
    const { passages, error } = AgmTexts.selectByReference(window.texts.passages, input, t && t.work);
    setRefError(error || "");
    if (error) return null;
    const select = $("passage");
    if (select) select.value = passages.length === 1 ? passages[0].urn : "";
    return showSelection(passages, String(input).trim());
  }

  /* ---------- the selected passages: their text, then their images ---------- */

  let imagePanel = null;
  let showToken = 0;   // ignore a slow image lookup once another image or selection is chosen
  let selectedUrns = []; // URNs of the selected passages, highlighted on the image

  /** Show the selected passages (`label`: how they were chosen) and the images indexed to them. */
  function showSelection(passages, label) {
    const out = $("passage-out");
    window.texts.selection = passages;
    window.texts.passage = passages.length === 1 ? passages[0] : null;
    selectedUrns = passages.map((p) => p.urn);
    if (!out) return passages;
    if (!passages.length) { out.replaceChildren(); imagePanel = null; return passages; }

    const head = passages.length === 1
      ? [el("h3", { textContent: passages[0].passage }),
         el("p", { className: "urn-line" }, el("code", { textContent: passages[0].urn }))]
      : [el("h3", { textContent: `${label} ` },
          el("span", { className: "count", textContent: `(${passages.length} passages: ${passages[0].passage} – ${passages[passages.length - 1].passage})` }))];
    const work = window.texts.text && window.texts.text.work;
    const body = passages.length === 1 ? cellsEl(passages[0].row)
      : AgmTexts.isSyllables(work) ? syllableLines(passages)
      : el("ol", { className: "selection" }, ...passages.map((p) => linked(el("li", { className: "sel-passage" + (p.records.length ? " has-roi" : "") },
          el("span", { className: "ref", textContent: p.passage, title: p.urn }), cellsEl(p.row)), p.urn)));

    const images = AgmTexts.imagesForPassages(passages);
    imagePanel = el("section", { className: "image-panel", id: "image-panel" });
    out.replaceChildren(...present(...head, body, imageChooser(images), imagePanel));
    window.texts.images = images;
    if (images.length) showImage(0);
    else imagePanel.replaceChildren(el("p", { className: "note muted",
      textContent: passages.length === 1 ? "No images are indexed to this passage." : "No images are indexed to these passages." }));
    return passages;
  }

  /**
   * Syllables shown as running text, one line per containing unit (1.1–1.5 on line "1", 2.1 on
   * line "2"). A syllable ending in "-" runs on into the next; others are followed by a space.
   * Each syllable is its own hover target, linked to its region.
   */
  function syllableLines(passages) {
    return el("ol", { className: "selection syllable-lines" },
      ...AgmTexts.groupByContainer(passages).map((g) => {
        const line = el("span", { className: "line-text greek" });
        g.passages.forEach((p, i) => {
          const text = (p.row.cells || [p.row.text]).join(" ");
          line.append(linked(el("span", { className: "sel-passage syl" + (p.records.length ? " has-roi" : ""),
            textContent: text, title: p.passage }), p.urn));
          if (i < g.passages.length - 1 && !/-$/.test(text)) line.append(" ");
        });
        return el("li", { className: "sel-line" },
          el("span", { className: "ref", textContent: g.container || "", title: g.passages.map((p) => p.passage).join(", ") }), line);
      }));
  }

  /** A row's cells side by side, with notation converted. */
  function cellsEl(row) {
    const body = el("div", { className: "cells" }, ...(row.cells || [row.text]).map(cellEl));
    if (row.cells) body.style.gridTemplateColumns = `repeat(${row.cells.length}, minmax(0, auto))`;
    return body;
  }

  /** When the selection is indexed on several images, buttons to choose one (else nothing). */
  function imageChooser(images) {
    if (images.length < 2) return null;
    return el("div", { className: "record-chooser" },
      el("span", { textContent: `On ${images.length} images: ` }),
      ...images.map((im, i) => {
        const src = AgmTexts.imageSource(window.texts.data, im.records[0]);
        const b = el("button", { type: "button", className: "record", textContent: src.label,
          title: `${im.imageUrn} (${im.records.length} passage${im.records.length === 1 ? "" : "s"})` });
        b.dataset.index = String(i);
        b.addEventListener("click", () => showImage(i));
        return b;
      }));
  }

  /** Show image `i` of the selection, with the selected passages' regions highlighted. */
  async function showImage(i) {
    const im = (window.texts.images || [])[i];
    if (!im || !imagePanel) return null;
    for (const b of document.querySelectorAll(".record-chooser .record")) b.classList.toggle("selected", b.dataset.index === String(i));
    const token = ++showToken;
    const panel = imagePanel;
    panel.replaceChildren(el("p", { className: "note muted", textContent: "Finding the image…" }));
    window.texts.viewer = null;

    const first = im.records[0];
    const img = await AgmTexts.resolveImage(window.texts.data, first, null, urnmapCache);
    if (token !== showToken) return null;
    if (img.error) {
      panel.replaceChildren(el("p", { className: "note", textContent: `Can't show the image: ${img.error}.` }));
      return img;
    }
    const focus = AgmTexts.unionRoi(im.records.map((r) => r.roi));
    const zoomBtn = el("button", { type: "button", textContent: im.records.length > 1 ? "Zoom to passages" : "Zoom to passage", disabled: !focus });
    const holder = el("div", { className: "viewer" });
    panel.replaceChildren(...present(
      el("div", { className: "image-head" },
        el("strong", { textContent: img.label }),
        el("code", { className: "meta", textContent: im.imageUrn }),
        el("span", { className: "image-actions" }, zoomBtn)),
      holder,
      img.credits ? el("p", { className: "credits", textContent: img.credits }) : null));

    const viewer = AgmViewer.createViewer(holder);
    window.texts.viewer = viewer;
    const work = window.texts.text && window.texts.text.work;
    viewer.setRegions(AgmTexts.imageRegions(window.texts.data, im.imageUrn, work));
    viewer.highlight(selectedUrns);
    // Hovering a region highlights it (and its passage in the list) while the pointer is there.
    viewer.onRegionHover((id) => hover(id));
    zoomBtn.addEventListener("click", () => viewer.focusRegion(focus, im.records.length > 1 ? 0.15 : 0.6));
    viewer.load(img.url, img.label);
    return img;
  }

  /** Temporarily highlight passage `urn` (region and list row); null returns to the selection. */
  function hover(urn) {
    if (window.texts.viewer) window.texts.viewer.highlight(urn || selectedUrns);
    for (const li of document.querySelectorAll("#passage-out .sel-passage")) {
      li.classList.toggle("hl", !!urn && li.dataset.urn === urn);
    }
  }

  /** Tag a list row with its passage URN so hovering it highlights its region. */
  function linked(node, urn) {
    node.dataset.urn = urn;
    node.addEventListener("pointerenter", () => hover(urn));
    node.addEventListener("pointerleave", () => hover(null));
    return node;
  }

  /** Text with Sowerby note URNs shown as Unicode signs in the notation font. */
  function cellEl(text) {
    const cell = el("span", { className: "cell greek" });
    for (const seg of AgmNotation.splitEmbeddedNotation(text)) {
      cell.append(seg.urn
        ? el("span", { className: "mousike-notation note-sign" + (seg.ok ? "" : " unknown"), textContent: seg.unicode, title: seg.urn })
        : seg.text);
    }
    return cell;
  }

  textSelect.addEventListener("change", () => selectText(textSelect.value));

  /* ---------- loading the release ---------- */

  function accept(d, source) {
    window.texts.data = d;
    setStatus(`Loaded mousike release ${d.version}`, false, `Source: ${source}`);
    renderMenu(d);
  }
  window.texts.accept = accept;

  async function loadUrl() {
    const url = (urlInput && urlInput.value.trim()) || AgmCex.DEFAULT_URL;
    setStatus("Loading…");
    try {
      accept(await AgmCex.loadCex(url), url);
    } catch (e) {
      setStatus(`Could not load ${url}: ${e.message}.` + (fileInput ? " Try loading a local copy instead." : ""), true);
    }
  }

  if (loadButton) loadButton.addEventListener("click", loadUrl);
  if (urlInput) urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadUrl(); });
  if (fileInput) fileInput.addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { accept(AgmCex.parseCex(await f.text()), f.name); }
    catch (err) { setStatus(`Could not parse ${f.name}: ${err.message}`, true); }
  });

  if (!window.AGM_NO_AUTOLOAD) loadUrl();
})();

</script>
</body>
</html>
