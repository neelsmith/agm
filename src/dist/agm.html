.mousike-notation { font-family: 'Mousike Notation', serif; }
  :root { --bg:#fbfaf7; --fg:#222; --muted:#666; --line:#ddd; --accent:#7a3b12; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a18; --fg:#e8e6e1; --muted:#9a968e; --line:#3a3834; --accent:#e0a070; --warn:#e0b050; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 14px; font-size: 1.4rem; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-bottom: 14px; }
  .controls input[type=url] { flex: 1 1 380px; min-width: 0; padding: 6px 8px; font: inherit;
    background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 4px; }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--bg); cursor: pointer; }
  #status { color: var(--muted); overflow-wrap: anywhere; }
  #status.error { color: #c0392b; }
  .summary { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:8px; margin: 18px 0; }
  .summary div { border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  .summary b { display:block; font-size: 1.3rem; }
  .summary span { color: var(--muted); font-size: .85rem; }
  .warnings { color: var(--warn); }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; margin-top: 8px; font-size: .9rem; }
  th, td { text-align: left; vertical-align: top; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.urn { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; white-space: nowrap; }
  .surface-picker, .image-picker, .audio-picker { display:flex; flex-wrap: wrap; gap:10px; align-items:center; margin: 14px 0; }
  .surface-picker label, .image-picker label, .audio-picker label { font-weight: 600; }
  .surface-picker select, .image-picker select, .audio-picker select { font: inherit; padding: 6px 8px; max-width: 100%; min-width: 0;
    background: var(--bg); color: inherit; border: 1px solid var(--line); border-radius: 4px; }
  #surface-out h2 { margin: 18px 0 2px; font-size: 1.15rem; }
  .urn-line, .counts { color: var(--muted); margin: 2px 0 8px; }
  .urn-line code { overflow-wrap: anywhere; }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { border-top: 1px solid var(--line); padding: 8px 0; }
  .entry-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .entry-head .ref { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .entry-head .roi { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; color: var(--muted); }
  .entry .content { margin-top: 3px; }
  .entry .content.greek { font-family: "Gentium Plus", "New Athena Unicode", Georgia, serif; font-size: 1.1rem; }
  .entry .content .mousike-notation { font-size: 1.6rem; line-height: 1.7; }
  .entry .content .notation { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .entry.unresolved .content { opacity: .7; }
  .entry .content .count { font-family: system-ui, sans-serif; color: var(--muted); }
  .entry .note { color: var(--warn); font-size: .85rem; margin-top: 3px; }
  td.notation { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
  .lines { margin: 10px 0 18px; }
  .lines h3 { font-size: 1rem; margin: 14px 0 4px; font-family: ui-monospace, Menlo, monospace; }
  .line { border-top: 1px solid var(--line); padding: 8px 0 10px; }
  .line-head { display: flex; gap: 12px; align-items: baseline; }
  .line-no { font-weight: 600; color: var(--muted); font-size: .85rem; }
  .line .note { color: var(--warn); font-size: .85rem; }
  .line-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .col-notes { font-size: 1.7rem; line-height: 1.6; white-space: nowrap; }
  .col-syl { font-family: "Gentium Plus", "New Athena Unicode", Georgia, serif; font-size: 1.2rem; }
  .col .missing { color: var(--warn); }
  .col.unmatched { opacity: .75; }
  .audio-picker audio { height: 36px; max-width: 100%; }
  .audio-picker .note { color: var(--warn); font-size: .85rem; overflow-wrap: anywhere; }
  .note.muted { color: var(--muted); font-size: .85rem; }
  .dse-panel > summary { font-size: .95rem; }
  .image-section { margin: 18px 0; }
  .viewer-frame { position: relative; overflow: hidden; height: min(70vh, 640px); border: 1px solid var(--line);
    border-radius: 6px; background: #111; cursor: grab; touch-action: none; user-select: none; }
  .viewer-frame.dragging { cursor: grabbing; }
  .viewer-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .viewer-img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; }
  .viewer-frame.empty .viewer-img { visibility: hidden; }
  .viewer-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #bbb; font-size: .9rem; padding: 16px; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
  .viewer-msg:empty { display: none; }
  .viewer-regions { position: absolute; inset: 0; pointer-events: none; }
  .viewer-frame.empty .viewer-regions { display: none; }
  .viewer-region { position: absolute; box-sizing: border-box; pointer-events: auto;
    border: 1.5px solid var(--roi, rgba(255,255,255,.75)); border-radius: 2px; }

<script>
/*
 * cex.js — parse a `mousike` CEX release into plain JS data structures.
 *
 * Classic script (no ES modules) so the built app works from file://.
 * In the browser it defines a global `AgmCex`; in Node it is a CommonJS module.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.AgmCex = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const DEFAULT_URL =
    "https://raw.githubusercontent.com/neelsmith/mousike/refs/heads/main/releases/current.cex";

  const DELIMITER = "|";

  /** Expected column headers for each tabular block. */
  const BLOCK_SCHEMAS = {
    images: ["path", "description", "credits", "urn"],
    surfaces: ["urn", "label"],
    audio: ["file", "label", "notation"],
    texts: ["urn", "text"],
    notes: ["urn", "text"],
    syllables: ["urn", "text"],
    dse: ["image", "text", "surface"],
  };

  /** All 8 blocks the app expects, in source order. */
  const BLOCK_NAMES = ["version"].concat(Object.keys(BLOCK_SCHEMAS));

  /**
   * Split raw CEX text into named blocks of non-empty lines.
   * Lines beginning with `//` are CEX comments and are skipped.
   * Lines before the first `#!` header are ignored.
   * @returns {Object<string, string[][]>} block name -> list of line arrays
   *   (a list of lists, because a block label may in principle repeat).
   */
  function splitBlocks(src) {
    const blocks = {};
    let current = null;
    const lines = String(src).replace(/^﻿/, "").split(/\r?\n/);
    for (const raw of lines) {
      const line = raw.trim();
      if (line.startsWith("#!")) {
        const name = line.slice(2).trim().toLowerCase();
        current = [];
        (blocks[name] = blocks[name] || []).push(current);
        continue;
      }
      if (current === null || line === "" || line.startsWith("//")) continue;
      current.push(raw.replace(/\s+$/, ""));
    }
    return blocks;
  }

  /**
   * Parse a delimited block whose first line is a header row.
   * Repeated blocks with the same name are concatenated.
   * Returns { rows, warnings } where rows are objects keyed by column name.
   */
  function parseTable(name, blockLists, warnings) {
    const expected = BLOCK_SCHEMAS[name];
    const rows = [];
    for (const lines of blockLists) {
      if (lines.length === 0) continue;
      const header = lines[0].split(DELIMITER).map((h) => h.trim());
      if (header.join("|") !== expected.join("|")) {
        warnings.push(
          `#!${name}: header "${header.join("|")}" differs from expected "${expected.join("|")}"`
        );
      }
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(DELIMITER);
        if (cols.length !== header.length) {
          warnings.push(
            `#!${name}: row ${i} has ${cols.length} columns, expected ${header.length}: ${lines[i]}`
          );
          continue;
        }
        const row = {};
        header.forEach((h, j) => (row[h] = cols[j].trim()));
        rows.push(row);
      }
    }
    return rows;
  }

  /* ---------- URN helpers ---------- */

  /** Split a URN with an optional `@extension` (e.g. a CITE2 image ROI). */
  function splitExtension(urn) {
    const at = urn.indexOf("@");
    return at < 0
      ? { base: urn, extension: null }
      : { base: urn.slice(0, at), extension: urn.slice(at + 1) };
  }

  /**
   * Parse an image region of interest (four comma-separated fractions of image size)
   * or return null. Order is left,top,width,height: in the 2026a DSE data the first
   * value increases across a line of the stele and the second increases line by line.
   */
  function parseRoi(extension) {
    if (!extension) return null;
    const nums = extension.split(",").map(Number);
    if (nums.length !== 4 || nums.some((n) => !Number.isFinite(n))) return null;
    const [left, top, width, height] = nums;
    return { left, top, width, height };
  }

  /**
   * Parse a CITE2 URN: colon-separated parts
   *   urn:cite2:NAMESPACE:COLLECTION[.VERSION]:OBJECT[@EXTENSION]
   * The final part is the object identifier; it may carry `@` + a region of interest.
   * A URN with only four parts identifies a collection, not an object (object = null).
   * Returns null if the string is not a cite2 URN.
   */
  function parseCite2(urn) {
    const { base, extension } = splitExtension(String(urn).trim());
    const parts = base.split(":");
    if (parts.length < 4 || parts.length > 5 || parts[0] !== "urn" || parts[1] !== "cite2") {
      return null;
    }
    const [collection, ...ver] = parts[3].split(".");
    return {
      urn: base, // object (or collection) URN without the extension
      namespace: parts[2],
      collection,
      version: ver.length ? ver.join(".") : null,
      object: parts.length === 5 ? parts[4] : null,
      extension,
      roi: parseRoi(extension),
    };
  }

  /**
   * Find the catalog image for a (possibly ROI-extended) image URN.
   * Matches on namespace, collection and object; when the reference omits a version,
   * any version in the catalog matches. Returns the image row or null.
   */
  function resolveImage(images, ref) {
    const r = typeof ref === "string" ? parseCite2(ref) : ref;
    if (!r || !r.object) return null;
    for (const img of images) {
      const c = img.cite2;
      if (!c) continue;
      if (c.namespace === r.namespace && c.collection === r.collection && c.object === r.object &&
          (r.version === null || r.version === c.version)) {
        return img;
      }
    }
    return null;
  }

  /**
   * Split a CTS URN into work component and passage reference.
   * urn:cts:mousike:epigraphic.seikilos.text:1.2
   *   -> { work: "urn:cts:mousike:epigraphic.seikilos.text", passage: "1.2" }
   */
  function ctsParts(urn) {
    const parts = urn.split(":");
    if (parts.length < 4 || parts[0] !== "urn" || parts[1] !== "cts") {
      return { work: urn, passage: null };
    }
    if (parts.length === 4) return { work: urn, passage: null };
    return { work: parts.slice(0, 4).join(":"), passage: parts.slice(4).join(":") };
  }

  /**
   * Tokenize a line of notation: whitespace separates note groups;
   * `~` joins notes sung to a single syllable (melisma).
   */
  function tokenizeNotes(text) {
    return text
      .split(/\s+/)
      .filter(Boolean)
      .map((group) => group.split("~").filter(Boolean));
  }

  /**
   * Derive the 2-tier citation of a notes edition: a line `…notes:L` with groups
   * g1 g2 … yields one record per note group, cited `…notes:L.N` (N counts from 1),
   * analogous to syllables `…syllables:L.N`.
   * Each record: { urn, work, passage, line (URN of the line), group (N),
   *   notes: [note, …], text: notes joined with "~" }
   */
  function noteGroups(noteLines) {
    const out = [];
    for (const line of noteLines) {
      line.tokens.forEach((notes, i) => {
        const passage = `${line.passage}.${i + 1}`;
        out.push({
          urn: `${line.work}:${passage}`,
          work: line.work,
          passage,
          line: line.urn,
          group: i + 1,
          notes,
          text: notes.join("~"),
        });
      });
    }
    return out;
  }

  /** Build a Map from key column to row; warn on duplicate keys. */
  function indexBy(rows, key, name, warnings) {
    const m = new Map();
    for (const r of rows) {
      if (m.has(r[key])) warnings.push(`#!${name}: duplicate ${key} ${r[key]}`);
      m.set(r[key], r);
    }
    return m;
  }

  /* ---------- main entry point ---------- */

  /**
   * Parse a complete mousike CEX release.
   * @param {string} src raw CEX text
   * @returns {object} { version, images, surfaces, audio, texts, notes,
   *   syllables, dse, index: {...Maps}, warnings: string[] }
   */
  function parseCex(src) {
    const warnings = [];
    const blocks = splitBlocks(src);

    for (const name of BLOCK_NAMES) {
      if (!blocks[name]) warnings.push(`missing block #!${name}`);
    }
    for (const name of Object.keys(blocks)) {
      if (!BLOCK_NAMES.includes(name)) warnings.push(`unrecognized block #!${name} ignored`);
    }

    // 1. version: a single bare value
    const versionLines = (blocks.version || []).flat();
    const version = versionLines.length ? versionLines[0].trim() : null;
    if (versionLines.length > 1) warnings.push("#!version: more than one line; using the first");

    const table = (name) => parseTable(name, blocks[name] || [], warnings);

    const images = table("images").map((r) => {
      const cite2 = parseCite2(r.urn);
      if (!cite2 || !cite2.object) warnings.push(`#!images: not a CITE2 object URN: ${r.urn}`);
      return Object.assign(r, { cite2 });
    });
    const surfaces = table("surfaces");
    const audio = table("audio");
    const texts = table("texts").map((r) => Object.assign(r, ctsParts(r.urn)));
    const notes = table("notes").map((r) =>
      Object.assign(r, ctsParts(r.urn), { tokens: tokenizeNotes(r.text) })
    );
    const syllables = table("syllables").map((r) => Object.assign(r, ctsParts(r.urn)));
    const dse = table("dse").map((r) => {
      const cite2 = parseCite2(r.image);
      if (!cite2 || !cite2.object) {
        warnings.push(`#!dse: image is not a CITE2 object URN: ${r.image}`);
      } else if (cite2.extension && !cite2.roi) {
        warnings.push(`#!dse: unparseable region of interest: ${r.image}`);
      }
      return Object.assign(r, {
        imageObject: cite2 ? cite2.urn : null,
        roi: cite2 ? cite2.roi : null,
        cite2,
      });
    });

    const index = {
      images: indexBy(images, "urn", "images", warnings),
      surfaces: indexBy(surfaces, "urn", "surfaces", warnings),
      texts: indexBy(texts, "urn", "texts", warnings),
      notes: indexBy(notes, "urn", "notes", warnings),
      syllables: indexBy(syllables, "urn", "syllables", warnings),
      // Derived from #!notes: one entry per note group, cited line.group
      noteGroups: indexBy(noteGroups(notes.filter((n) => n.passage)), "urn", "notes (groups)", warnings),
    };

    return { version, images, surfaces, audio, texts, notes, syllables, dse, index, warnings };
  }

  /** Fetch and parse a CEX release (browser or Node 18+). */
  async function loadCex(url, fetchImpl) {
    const f = fetchImpl || (typeof fetch !== "undefined" ? fetch : null);
    if (!f) throw new Error("No fetch implementation available");
    const res = await f(url || DEFAULT_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status} loading ${url || DEFAULT_URL}`);
    return parseCex(await res.text());
  }

  return {
    DEFAULT_URL,
    BLOCK_NAMES,
    BLOCK_SCHEMAS,
    splitBlocks,
    splitExtension,
    parseRoi,
    parseCite2,
    resolveImage,
    ctsParts,
    tokenizeNotes,
    noteGroups,
    parseCex,
    loadCex,
  };
});

</script>
<script>
/*
 * edition.js — queries over parsed mousike data (output of AgmCex.parseCex).
 *
 * Classic UMD script: global `AgmEdition` in the browser, CommonJS in Node.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.AgmEdition = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /** Surfaces for a menu: [{ urn, label }] in source order. */
  function surfaceMenu(data) {
    return data.surfaces.map((s) => ({ urn: s.urn, label: s.label }));
  }

  /** All DSE records whose surface column equals `surfaceUrn`, in source order. */
  function dseForSurface(data, surfaceUrn) {
    return data.dse.filter((r) => r.surface === surfaceUrn);
  }

  /**
   * Look up the passage a DSE text URN cites, in the `texts`, `notes` or `syllables` block.
   *
   * Notes are citable by line (`notes:1`) or by note group within a line (`notes:1.2`,
   * the 2nd whitespace-separated group); a group record also has `notes` (array) and `line`.
   *
   * Returns { urn, block, unit, match, record }:
   *   block  "texts" | "notes" | "syllables" | null
   *   unit   "line" | "group" | "syllable" | null
   *   match  "exact"     — the URN is in that block
   *          "container" — not found, but a containing passage is (e.g. text:1 for text:1.1);
   *                        `record` is the containing passage, for context only
   *          null        — nothing found; `record` is null
   */
  function resolvePassage(data, urn) {
    const blocks = [
      ["texts", "line", data.index.texts],
      ["notes", "line", data.index.notes],
      ["notes", "group", data.index.noteGroups],
      ["syllables", "syllable", data.index.syllables],
    ];
    for (const [block, unit, m] of blocks) {
      if (m.has(urn)) return { urn, block, unit, match: "exact", record: m.get(urn) };
    }
    // Walk up the citation hierarchy: a:1.2.3 -> a:1.2 -> a:1
    const colon = urn.lastIndexOf(":");
    if (colon > 0) {
      const work = urn.slice(0, colon);
      const ref = urn.slice(colon + 1).split(".");
      for (let n = ref.length - 1; n >= 1; n--) {
        const parent = `${work}:${ref.slice(0, n).join(".")}`;
        for (const [block, unit, m] of blocks) {
          if (m.has(parent)) return { urn, block, unit, match: "container", record: m.get(parent) };
        }
      }
    }
    return { urn, block: null, unit: null, match: null, record: null };
  }

  /**
   * Everything indexed to one surface: for each DSE record, the cited passage.
   * Returns { surface, entries: [{ dse, passage }], counts }
   */
  function surfaceContents(data, surfaceUrn) {
    const surface = data.index.surfaces.get(surfaceUrn) || null;
    const entries = dseForSurface(data, surfaceUrn).map((dse) => ({
      dse,
      passage: resolvePassage(data, dse.text),
    }));
    const counts = { total: entries.length, exact: 0, container: 0, missing: 0 };
    for (const e of entries) counts[e.passage.match || "missing"]++;
    return { surface, entries, counts };
  }

  /* ---------- syllable ↔ note-group alignment ---------- */

  /**
   * The text a CTS work belongs to, without its last work-id component:
   * "urn:cts:mousike:epigraphic.seikilos.notes" -> "urn:cts:mousike:epigraphic.seikilos".
   * The notes and syllables editions of one text share this base.
   */
  function textBase(work) {
    const colon = work.lastIndexOf(":");
    const id = work.slice(colon + 1);
    const dot = id.lastIndexOf(".");
    return dot < 0 ? work : work.slice(0, colon + 1) + id.slice(0, dot);
  }

  /** Split a 2-tier passage "L.N" into { line: "L", n: N }; null if not 2-tier. */
  function splitLineRef(passage) {
    const parts = String(passage || "").split(".");
    if (parts.length !== 2 || !parts[0] || !/^\d+$/.test(parts[1])) return null;
    return { line: parts[0], n: Number(parts[1]) };
  }

  const byNumber = (a, b) => {
    const na = Number(a), nb = Number(b);
    return Number.isNaN(na) || Number.isNaN(nb) ? String(a).localeCompare(String(b)) : na - nb;
  };

  /**
   * Pair syllables with note groups line by line for one text.
   * `base` is a textBase() value. Line L's syllables (`…syllables:L.N`) and note groups
   * (`…notes:L.N`) are matched by N.
   * Returns [{ line, syllables: [rec], groups: [rec], columns: [{ n, syllable, group }],
   *   aligned }] in line order; a missing partner is null, and `aligned` is true when the
   *   line has the same number of syllables and note groups.
   */
  function alignLines(data, base) {
    const lines = new Map();
    const add = (rec, kind) => {
      if (textBase(rec.work) !== base) return;
      const ref = splitLineRef(rec.passage);
      if (!ref) return;
      if (!lines.has(ref.line)) lines.set(ref.line, { syllables: [], groups: [] });
      lines.get(ref.line)[kind].push({ n: ref.n, rec });
    };
    for (const s of data.syllables) add(s, "syllables");
    for (const g of data.index.noteGroups.values()) add(g, "groups");

    return [...lines.keys()].sort(byNumber).map((line) => {
      const { syllables, groups } = lines.get(line);
      const sylByN = new Map(syllables.map((x) => [x.n, x.rec]));
      const grpByN = new Map(groups.map((x) => [x.n, x.rec]));
      const ns = [...new Set([...sylByN.keys(), ...grpByN.keys()])].sort((a, b) => a - b);
      return {
        line,
        syllables: syllables.sort((a, b) => a.n - b.n).map((x) => x.rec),
        groups: groups.sort((a, b) => a.n - b.n).map((x) => x.rec),
        columns: ns.map((n) => ({ n, syllable: sylByN.get(n) || null, group: grpByN.get(n) || null })),
        aligned: syllables.length === groups.length,
      };
    });
  }

  /**
   * Texts a surface's DSE records cite, each with its aligned lines.
   * Returns [{ base, lines }] in order of first citation; texts with no syllables or
   * note groups are left out.
   */
  function surfaceLines(data, surfaceUrn) {
    const bases = [];
    for (const r of dseForSurface(data, surfaceUrn)) {
      const { work } = ctsWork(r.text);
      if (!work) continue;
      const b = textBase(work);
      if (!bases.includes(b)) bases.push(b);
    }
    return bases
      .map((base) => ({ base, lines: alignLines(data, base) }))
      .filter((t) => t.lines.length > 0);
  }

  /** "urn:cts:ns:work:passage" -> { work: "urn:cts:ns:work" } (work null if not CTS). */
  function ctsWork(urn) {
    const parts = String(urn || "").split(":");
    if (parts.length < 4 || parts[0] !== "urn" || parts[1] !== "cts") return { work: null };
    return { work: parts.slice(0, 4).join(":") };
  }

  /**
   * Distinct images a surface's DSE records cite, with any `@` region of interest removed,
   * in order of first citation. Each is labelled with the `description` of the `#!images`
   * row whose `urn` is exactly equal; if there is none, the label is the URN and `image` is null.
   * Returns [{ urn, label, image }].
   */
  function surfaceImages(data, surfaceUrn) {
    const byUrn = new Map(data.images.map((img) => [img.urn, img]));
    const out = [];
    const seen = new Set();
    for (const r of dseForSurface(data, surfaceUrn)) {
      const urn = String(r.image || "").split("@")[0].trim();
      if (!urn || seen.has(urn)) continue;
      seen.add(urn);
      const image = byUrn.get(urn) || null;
      out.push({ urn, label: image && image.description ? image.description : urn, image });
    }
    return out;
  }

  /**
   * Regions of interest on one image (URN without `@`) from a surface's DSE records.
   * Returns [{ id, roi, kind, dse }] in DSE order, where `id` is the DSE text URN and `kind` is
   * "notes" (a note group or notes line), "syllables", "texts" or "other" (passage not found).
   * Records without a parseable region are left out.
   */
  function imageRegions(data, surfaceUrn, imageUrn) {
    const out = [];
    for (const r of dseForSurface(data, surfaceUrn)) {
      if (!r.roi || String(r.image || "").split("@")[0].trim() !== imageUrn) continue;
      const i = data.index;
      const kind = i.noteGroups.has(r.text) || i.notes.has(r.text) ? "notes"
        : i.syllables.has(r.text) ? "syllables"
        : i.texts.has(r.text) ? "texts"
        : "other";
      out.push({ id: r.text, roi: r.roi, kind, dse: r });
    }
    return out;
  }

  /* ---------- audio ---------- */

  /** Where audio files are served (the mousike repo's `audio` directory). */
  const AUDIO_BASE_URL = "https://raw.githubusercontent.com/neelsmith/mousike/refs/heads/main/audio";

  /** URL of an `#!audio` row's file, or null if it has none. */
  function audioUrl(track) {
    if (!track || !track.file) return null;
    return `${AUDIO_BASE_URL}/${String(track.file).trim().replace(/^\/+/, "")}`;
  }

  /** Line-level part of a passage reference: "3.2" -> "3". */
  const lineOf = (ref) => String(ref).split(".")[0];

  /**
   * Does line `line` fall within passage reference `passage`?
   * `passage` may be null (the whole work), a single reference ("2", "2.3") or a range
   * ("1-6", "1.2-3.4"); only the line-level part of each end is compared, numerically when
   * both are numbers.
   */
  function lineInPassage(line, passage) {
    if (passage === null || passage === undefined || passage === "") return true;
    const [from, to = from] = String(passage).split("-").map((p) => lineOf(p.trim()));
    const l = String(line);
    const nums = [l, from, to].map(Number);
    if (nums.every((n) => Number.isFinite(n))) return nums[1] <= nums[0] && nums[0] <= nums[2];
    return l === from || l === to;
  }

  /**
   * Audio tracks for the notation shown for a surface: every `#!audio` row whose `notation`
   * URN is in the same notes work as a displayed line, with a passage (or range) that
   * includes at least one displayed line. Returns [{ label, file, notation, url, lines }] in
   * `#!audio` order, where `lines` are the matching displayed line numbers.
   */
  function surfaceAudio(data, surfaceUrn) {

/*

 *
 * A JavaScript port of mousike's `note.py` / `unicode.py`; output should be identical.
 *
 * A note is cited by a URN in `urn:cite2:zst:` (the short form drops the prefix) with up to

 *   1. base note

 *   4. arsis: 1 if the note carries an arsis dot (stigme), else 0
 *   5. hyphen: 1 if the note carries a hyphen, else 0 (not rendered)

 * which has a single tier).
 *
 * Rendering: the first two tiers choose the sign from Sowerby's table; length and arsis are
 * added as combining marks after the sign's first character (so on the letter, not the
 * prime, in upper-octave signs like `Ο′`). Groups are separated by one space; notes joined
 * with `~` (several notes over one syllable) are written with no space.

    function fit() {
      if (!loaded) return;
      st = fitState(img.naturalWidth, img.naturalHeight, frame.clientWidth, frame.clientHeight);
      fitScale = st.scale;
      apply();
    }
    function zoom(factor, px, py) {
      if (!loaded) return;
      const c = center();
      st = zoomAt(st, factor, px ?? c.x, py ?? c.y, fitScale);
      apply();
    }
    function local(e) {
      const r = frame.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    // Pointer handling: one pointer pans, two pointers pinch-zoom.
    const pointers = new Map();
    let pinchDist = 0;
    frame.addEventListener("pointerdown", (e) => {
      if (!loaded) return;
      frame.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, local(e));
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      }
      dragging = true;
      frame.classList.add("dragging");
    });
    frame.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const p = local(e);
      pointers.set(e.pointerId, p);
      if (pointers.size === 1) {
        st = { ...st, x: st.x + p.x - prev.x, y: st.y + p.y - prev.y };
        apply();
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDist > 0) zoom(d / pinchDist, (a.x + b.x) / 2, (a.y + b.y) / 2);
        pinchDist = d;
      }
    });
    const release = (e) => {
      pointers.delete(e.pointerId);
      pinchDist = 0;
      if (!pointers.size) { dragging = false; frame.classList.remove("dragging"); }
    };
    frame.addEventListener("pointerup", release);
    frame.addEventListener("pointercancel", release);

    frame.addEventListener("wheel", (e) => {
      if (!loaded) return;
      e.preventDefault();
      const p = local(e);
      zoom(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), p.x, p.y);
    }, { passive: false });
    frame.addEventListener("dblclick", (e) => { const p = local(e); zoom(2, p.x, p.y); });
    frame.addEventListener("keydown", (e) => {
      const step = 40;
      const moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (e.key === "+" || e.key === "=") zoom(1.5);
      else if (e.key === "-") zoom(1 / 1.5);
      else if (e.key === "0") fit();
      else if (moves[e.key]) { st = { ...st, x: st.x + moves[e.key][0], y: st.y + moves[e.key][1] }; apply(); }
      else return;
      e.preventDefault();
    });

    img.addEventListener("load", () => {
      loaded = true;
      msg.textContent = "";
      frame.classList.remove("empty");
      fit();
    });
    img.addEventListener("error", () => {
      loaded = false;
      img.style.transform = "";
      frame.classList.add("empty");
      msg.textContent = `Could not load image ${img.src}`;
    });

    function load(url, alt) {
      loaded = false;
      frame.classList.add("empty");
      msg.textContent = "Loading image…";
      img.alt = alt || "";
      img.src = url;
    }

    return {
      load, fit, zoom, setRegions, highlight,
      onRegionHover: (fn) => { hoverFn = fn; },
      state: () => ({ ...st }),
      element: frame,
    };
  }

  return { createViewer, fitState, zoomAt, regionBox, MAX_SCALE };
});

</script>
<script>
/* app.js — UI for the agm reader. Depends on globals AgmCex, AgmEdition, AgmNotation and AgmViewer. */
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // Data-source controls exist only in some builds (see build.js), so these may be null.
  const urlInput = $("url");
  const loadButton = $("load");
  const fileInput = $("file");
  const statusEl = $("status");
  const surfaceSelect = $("surface");
  const surfaceOut = $("surface-out");
  const dataOut = $("data-out");

  /** App state, exposed for console inspection and tests. */
  window.agm = { data: null, selectSurface };

  if (urlInput) urlInput.value = AgmCex.DEFAULT_URL;

  function setStatus(msg, isError, title) {
    statusEl.textContent = msg;
    statusEl.title = title || "";
    statusEl.className = isError ? "error" : "";
  }

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, attrs || {});
    for (const k of kids) e.append(k);
    return e;
  }

  /* ---------- surface menu and contents ---------- */

  function renderSurfaceMenu(d) {
    const menu = AgmEdition.surfaceMenu(d);
    surfaceSelect.replaceChildren(
      el("option", { value: "", textContent: menu.length ? "Choose an artifact…" : "No artifacts in this release" }),
      ...menu.map((s) => el("option", { value: s.urn, textContent: s.label }))
    );
    surfaceSelect.disabled = menu.length === 0;
    surfaceOut.replaceChildren();
  }

  /** Notation rendered in the Mousike Notation font, with the URN encoding below it. */
  function notationEl(urnText, extra) {
    return el("div", { className: "content" },
      el("div", { className: "mousike-notation", textContent: AgmNotation.notesToUnicodeSafe(urnText) }),
      el("div", { className: "notation" }, el("span", { textContent: urnText }), extra || ""));
  }

  function contentEl(p) {
    if (p.block === "notes") {
      const n = p.unit === "group" ? p.record.notes.length : 0;
      return notationEl(p.record.text,
        n > 1 ? el("span", { className: "count", textContent: ` (${n} notes on one syllable)` }) : null);
    }
    return el("div", { className: "content greek", textContent: p.record.text });
  }

  function passageBody(p) {
    if (p.match === "exact") return contentEl(p);
    if (p.match === "container") {
      return el("div", null,
        el("div", { className: "note", textContent: `Not found in ${p.block}. Containing passage ${shortRef(p.record.urn)}:` }),
        contentEl(p));
    }
    return el("div", { className: "note", textContent: "Not found in texts, notes or syllables." });
  }

  function selectSurface(urn) {
    surfaceSelect.value = urn || "";
    stopAudio(); // a detached <audio> keeps playing, so stop it before replacing the view
    window.agm.surface = urn || null;
    window.agm.viewer = null;
    const d = window.agm.data;
    if (!d || !urn) { surfaceOut.replaceChildren(); return null; }
    const view = AgmEdition.surfaceContents(d, urn);
    const { counts } = view;

    const head = el("p", { className: "counts" });
    head.textContent = counts.total === 0
      ? "No DSE records for this artifact."
      : `${counts.total} DSE record(s): ${counts.exact} resolved` +
        (counts.container ? `, ${counts.container} only to a containing passage` : "") +
        (counts.missing ? `, ${counts.missing} not found` : "") + ".";

    const list = el("ol", { className: "entries" });
    for (const { dse, passage } of view.entries) {
      const roi = dse.roi;
      list.append(el("li", { className: passage.match === "exact" ? "entry" : "entry unresolved" },
        el("div", { className: "entry-head" },
          el("span", { className: "ref", textContent: shortRef(dse.text), title: dse.text }),
          el("span", {
            className: "roi",
            textContent: roi ? "region " + [roi.left, roi.top, roi.width, roi.height].join(", ") : "no region",
            title: dse.image,
          })),
        passageBody(passage)));
    }

    surfaceOut.replaceChildren(
      audioSection(AgmEdition.surfaceAudio(d, urn)),
      el("h2", { textContent: view.surface ? view.surface.label : urn }),
      el("p", { className: "urn-line" }, el("code", { textContent: urn })),
      linesView(AgmEdition.surfaceLines(d, urn)),
      imageSection(AgmEdition.surfaceImages(d, urn)),
      el("details", { className: "dse-panel" },
        el("summary", { textContent: `DSE records (${counts.total})` }),
        head,
        list));
    return view;
  }

  /* ---------- audio menu: tracks indexed to the displayed notation lines ---------- */

  let player = null; // the <audio> element for the current surface

  function stopAudio() {
    if (player) { player.pause(); player.removeAttribute("src"); player.load(); }
    player = null;
    window.agm.track = null;
  }

  function audioSection(tracks) {
    window.agm.tracks = tracks;
    if (!tracks.length) {
      return el("p", { className: "note muted", textContent: "No audio for this artifact." });
    }
    const select = el("select", { id: "audio" },
      el("option", { value: "", textContent: "Choose a recording…" }),
      ...tracks.map((t, i) => el("option", { value: String(i), textContent: t.label, title: t.file })));
    select.addEventListener("change", () => playTrack(select.value === "" ? null : Number(select.value)));
    player = el("audio", { id: "player", controls: true, preload: "none" });
    player.hidden = true;
    const msg = el("span", { id: "audio-msg", className: "note" });
    player.addEventListener("error", () => {
      if (player && player.getAttribute("src")) msg.textContent = `Could not load ${player.src}`;
    });
    return el("section", { className: "audio-picker" },
      el("label", { htmlFor: "audio", textContent: "Audio" }), select, player, msg);
  }

  /** Play track number `i` of the current artifact's audio menu; null stops playback. */
  function playTrack(i) {
    const t = i === null ? null : (window.agm.tracks || [])[i];
    const msg = $("audio-msg");
    const select = $("audio");
    if (!player) return null;
    if (msg) msg.textContent = "";
    if (!t) {
      player.pause();
      player.hidden = true;
      window.agm.track = null;
      if (select) select.value = "";
      return null;
    }
    if (select) select.value = String(i);
    window.agm.track = t;
    player.hidden = false;
    player.src = t.url;
    const p = player.play();
    if (p && p.catch) {
      p.catch((e) => {
        if (msg && e.name !== "AbortError") msg.textContent = `Could not play: ${e.message}`;
      });
    }
    return t;
  }
  window.agm.playTrack = playTrack;

  /* ---------- image menu: distinct images cited by the surface's DSE records ---------- */

  let imageOut = null; // element holding the viewer for the selected image

  /** Image menu plus a pan/zoom view of the selected image (first one preselected). */
  function imageSection(images) {
    window.agm.images = images;
    window.agm.image = null;
    if (!images.length) {
      imageOut = null;
      return el("p", { className: "note", textContent: "No images cited for this artifact." });
    }
    const select = el("select", { id: "image" },
      ...images.map((im) => el("option", {
        value: im.urn,
        textContent: im.image ? im.label : `${im.label} (not in image catalog)`,
        title: im.urn,
      })));
    select.addEventListener("change", () => selectImage(select.value));
    imageOut = el("div", { className: "image-out" });
    const sec = el("section", { className: "image-section" },
      el("div", { className: "image-picker" },
        el("label", { htmlFor: "image", textContent: "Image" }), select),
      imageOut);
    // Defer so the section is in the document (the viewer needs its size to fit the image).
    setTimeout(() => selectImage(images[0].urn), 0);
    return sec;
  }

  /** Make `urn` (an image URN without region of interest) the selected image and show it. */
  function selectImage(urn) {
    const im = (window.agm.images || []).find((x) => x.urn === urn);
    if (!im || !imageOut) return null;
    window.agm.image = urn;
    const select = $("image");
    if (select) select.value = urn;

    const url = AgmEdition.imageUrl(im.image);
    if (!url) {
      imageOut.replaceChildren(el("p", { className: "note",
        textContent: `${urn} is not in the image catalog, so it can't be displayed.` }));
      return urn;
    }
    const holder = el("div", { className: "viewer" });
    imageOut.replaceChildren(holder);
    const viewer = AgmViewer.createViewer(holder);
    window.agm.viewer = viewer;

    // Regions of interest on this image, linked to the line view by DSE text URN.
    const regions = AgmEdition.imageRegions(window.agm.data, window.agm.surface, urn);
    viewer.setRegions(regions.map((r) => ({ id: r.id, roi: r.roi, kind: r.kind, title: shortRef(r.id) })));
    viewer.onRegionHover((id) => highlight(id));
    const withRegion = new Set(regions.map((r) => r.id));
    for (const e of surfaceOut.querySelectorAll("[data-urn]")) {
      e.classList.toggle("has-roi", withRegion.has(e.dataset.urn));
    }
    highlight(null);

    viewer.load(url, im.label);
    if (regions.length) {
      imageOut.append(el("p", { className: "roi-key" },
        el("span", { className: "sw", style: "border-color: rgba(255,190,60,.95)" }), "notes",
        el("span", { className: "sw", style: "border-color: rgba(80,200,255,.95)" }), "syllables",
        ` · ${regions.length} region(s). Hover a region or a syllable/note to link them.`));
    }
    if (im.image.credits) {
      imageOut.append(el("p", { className: "credits", textContent: im.image.credits }));
    }
    return urn;
  }
  window.agm.selectImage = selectImage;

  /* ---------- linked highlighting: line view ↔ image regions ---------- */

  let highlighted = null;

  /** Highlight passage `urn` (a DSE text URN) in the line view and on the image; null clears. */
  function highlight(urn) {
    highlighted = urn || null;
    for (const e of surfaceOut.querySelectorAll(".hl")) e.classList.remove("hl");
    if (highlighted) {
      for (const e of surfaceOut.querySelectorAll("[data-urn]")) {
        if (e.dataset.urn === highlighted) e.classList.add("hl");
      }
    }
    if (window.agm.viewer) window.agm.viewer.highlight(highlighted);
  }
  window.agm.highlight = highlight;

  /** Tag a line-view element with its passage URN so it links to image regions. */
  function linked(e, urn) {
    e.dataset.urn = urn;
    e.addEventListener("pointerenter", () => highlight(urn));
    e.addEventListener("pointerleave", () => { if (highlighted === urn) highlight(null); });
    return e;
  }

  /* ---------- line view: syllables with their note groups above ---------- */

  function linesView(texts) {
    const sec = el("section", { className: "lines" });
    if (!texts.length) {
      sec.append(el("p", { className: "note", textContent: "No syllables or notes for this artifact." }));
      return sec;
    }
    for (const { base, lines } of texts) {
      if (texts.length > 1) sec.append(el("h3", { textContent: shortRef(base) }));
      for (const ln of lines) sec.append(lineEl(ln));
    }
    return sec;
  }

  function lineEl(ln) {
    const head = el("div", { className: "line-head" },
      el("span", { className: "line-no", textContent: `Line ${ln.line}` }));
    if (!ln.aligned) {
      head.append(el("span", {
        className: "note",
        textContent: `${ln.syllables.length} syllable(s), ${ln.groups.length} note group(s)`,
      }));
    }
    const row = el("div", { className: "line-row" });
    for (const c of ln.columns) {
      const g = c.group, s = c.syllable;
      const col = el("div", { className: "col" + (g && s ? "" : " unmatched") });
      col.append(g
        ? linked(el("div", {
            className: "mousike-notation col-notes",
            textContent: AgmNotation.notesToUnicodeSafe(g.text),
            title: `${shortRef(g.urn)}  ${g.text}`,
          }), g.urn)
        : el("div", { className: "col-notes missing", textContent: "—", title: "no note group" }));
      col.append(s
        ? linked(el("div", { className: "greek col-syl", textContent: s.text, title: shortRef(s.urn) }), s.urn)
        : el("div", { className: "col-syl missing", textContent: "—", title: "no syllable" }));
      row.append(col);
    }
    return el("div", { className: ln.aligned ? "line" : "line misaligned" }, head, row);
  }

  /** "urn:cts:mousike:epigraphic.seikilos.notes:1.1" -> "notes:1.1" */
  function shortRef(urn) {
    const { work, passage } = AgmCex.ctsParts(urn);
    return `${work.split(".").pop()}${passage ? ":" + passage : ""}`;
  }

  surfaceSelect.addEventListener("change", () => selectSurface(surfaceSelect.value));

  /* ---------- raw data inspector ---------- */

  const GREEK_COLS = { texts: ["text"], syllables: ["text"] };

  function tableFor(name, rows) {
    const cols = AgmCex.BLOCK_SCHEMAS[name];
    const t = el("table");
    t.append(el("thead", null, el("tr", null, ...cols.map((c) => el("th", { textContent: c })))));
    const tb = el("tbody");
    for (const r of rows) {
      tb.append(el("tr", null, ...cols.map((c) => {
        const v = r[c];
        let cls = "";
        if (/^urn:/.test(v)) cls = "urn";
        else if ((GREEK_COLS[name] || []).includes(c)) cls = "greek";
        return el("td", { textContent: v, className: cls });
      })));
    }
    t.append(tb);
    return el("div", { className: "scroll" }, t);
  }

  function renderData(d) {
    dataOut.replaceChildren();
    const summary = el("div", { className: "summary" });
    summary.append(el("div", null, el("b", { textContent: d.version ?? "—" }), el("span", { textContent: "version" })));
    for (const name of AgmCex.BLOCK_NAMES.slice(1)) {
      summary.append(el("div", null, el("b", { textContent: String(d[name].length) }), el("span", { textContent: name })));
    }
    dataOut.append(summary);

    if (d.warnings.length) {
      dataOut.append(el("details", { className: "warnings" },
        el("summary", { textContent: `${d.warnings.length} warning(s)` }),
        el("ul", null, ...d.warnings.map((w) => el("li", { textContent: w })))));
    }
    for (const name of AgmCex.BLOCK_NAMES.slice(1)) {
      dataOut.append(el("details", null,
        el("summary", { textContent: `#!${name} (${d[name].length})` }),
        tableFor(name, d[name])));
    }
  }

  /* ---------- loading ---------- */

  function accept(d, source) {
    window.agm.data = d;
    setStatus(`Loaded mousike release ${d.version}`, false, `Source: ${source}`);
    renderSurfaceMenu(d);
    renderData(d);
  }
  window.agm.accept = accept;

  async function loadUrl() {
    const url = (urlInput && urlInput.value.trim()) || AgmCex.DEFAULT_URL;
    setStatus("Loading…");
    try {
      accept(await AgmCex.loadCex(url), url);
    } catch (e) {
      setStatus(`Could not load ${url}: ${e.message}.` + (fileInput ? " Try loading a local copy instead." : ""), true);
    }
  }

  if (loadButton) loadButton.addEventListener("click", loadUrl);
  if (urlInput) urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadUrl(); });
  if (fileInput) fileInput.addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { accept(AgmCex.parseCex(await f.text()), f.name); }
    catch (err) { setStatus(`Could not parse ${f.name}: ${err.message}`, true); }
  });

  if (!window.AGM_NO_AUTOLOAD) loadUrl();
})();

</script>
</body>
</html>
